<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Gestión de Proyectos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout/base.css" />
    <link rel="stylesheet" href="../css/layout/sidebar.css" />
    <link rel="stylesheet" href="../css/layout/content.css" />
  <link rel="stylesheet" href="../css/components/chips.css" />
    <link rel="stylesheet" href="../css/components/cards.css" />
    <link rel="stylesheet" href="../css/components/modals.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/toasts.css" />
    <link rel="stylesheet" href="../css/components/utilities.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/pages/proyectos.css" />
  
</head>
<body class="role-admin"> <!-- Role class added dynamically -->
  <div class="app">
    <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <header class="content-header">
          <div class="content-title">
            <h1 class="role-admin">Gestión de Proyectos</h1>
            <h1 class="role-lider">Mis Proyectos</h1>
            <p class="role-admin">Listado de todos los proyectos activos e históricos.</p>
            <p class="role-lider">Supervisa el avance de tus frentes de obra.</p>
          </div>
          <div class="chips-row" id="projectFilters">
            <div class="chip chip-active" data-status="activo">Activos</div>
            <div class="chip" data-status="finalizado">Finalizados</div>
            <div class="chip" data-status="all">Todos</div>
          </div>
        </header>

        <section>
            <div class="action-bar" >
                <input type="text" id="projectInputSearch" class="input-search" placeholder="Buscar proyecto (Nombre, Ciudad, Líder...)" >
                <button class="btn-primary role-admin" id="btnNewProject">
                    <span class="icon">+</span>
                    <span>Nuevo Proyecto</span>
                </button>
            </div>
            
            <div class="project-list" id="projectList">
                <!-- Los proyectos se cargarán dinámicamente aquí -->
            </div>

            <div class="flex-row" style="justify-content: center; margin-top: 20px;">
                <button class="btn-small-muted">Cargar más proyectos</button>
            </div>
        </section>
      </section>
    </main>
  </div>
    <div id="app-footer"></div>

        <!-- Modal para Nuevo Proyecto -->
        <div id="projectModal" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <h2>Crear Nuevo Proyecto</h2>
            <span class="close-modal" id="closeProjectModal">&times;</span>
        </div>
        <form id="projectForm">
            <div class="input-group">
                <label for="nombre_p">Nombre del Proyecto</label>
                <input type="text" id="nombre_p" name="nombre" required>
            </div>
            <div class="input-group">
                <label for="descripcion_p">Descripción</label>
                <textarea id="descripcion_p" name="descripcion" required></textarea>
            </div>
            <div class="input-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" required>
            </div>
            <div class="input-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>
            <div class="input-group">
                <label for="presupuesto">Presupuesto</label>
                <input type="number" id="presupuesto" name="presupuesto" required>
            </div>
            <div class="input-group">
                <label for="id_lider_fk">Líder de Proyecto</label>
                <select id="id_lider_fk" name="id_lider_fk" required>
                    <option value="">Cargando líderes...</option>
                </select>
            </div>
            <div class="input-group">
                <label for="foto_render">Imagen Render (Opcional)</label>
                <input type="file" id="foto_render" name="foto_render" accept="image/*">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; height: 45px;">Crear Proyecto</button>
        </form>
        </div>
        </div>

        <script type="module" src="../js/main.js?v=1.1.0"></script>
        </body>
        </html>
