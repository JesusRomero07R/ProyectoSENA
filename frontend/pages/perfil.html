<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Mi Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles.css?v=1.1.0" />
  
</head>
<body>
  <div class="app">
    <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <header class="content-header">
          <div class="content-title">
            <h1>Mi perfil</h1>
            <p>Consulta tu información y tu rendimiento.</p>
          </div>
        </header>

        <section>
          <div class="card" style="background:var(--bg-card); border-radius:var(--radius-lg); overflow:hidden; border:1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <div class="profile-header" style="display:flex; align-items:center; gap:20px; padding:30px; background:linear-gradient(to right, rgba(99,102,241,0.1), transparent); border-bottom:1px solid rgba(255, 255, 255, 0.05); flex-wrap:wrap;">
              <div class="profile-avatar" id="profile-avatar-large" style="width:80px; height:80px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:bold; box-shadow:0 4px 10px rgba(99,102,241,0.3);">U</div>
              <div>
                <div class="profile-name" id="profile-name" style="font-size:1.8rem; font-weight:bold; color:var(--text); margin-bottom:5px;">Cargando...</div>
                <div class="profile-role" id="profile-role" style="color:var(--muted); font-size:1rem; margin-bottom:10px;">Cargando...</div>
                <div class="profile-badges" style="display:flex; gap:10px; flex-wrap:wrap;">
                  <span class="badge" style="background:rgba(34,197,94,0.2); color:#4ade80; padding:4px 10px; border-radius:15px; font-size:0.8rem; font-weight:bold;">Activo</span>
                  <span class="badge badge-secondary" id="profile-dept" style="background:rgba(255,255,255,0.1); color:var(--text); padding:4px 10px; border-radius:15px; font-size:0.8rem;">Constructora GG</span>
                </div>
              </div>
            </div>

            <div class="profile-grid" style="padding:30px;">
              <!-- Info personal -->
              <div class="profile-info-list" style="display:flex; flex-direction:column; gap:15px; max-width:500px;">
                <div class="profile-info-row" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
                  <span class="profile-info-label" style="color:var(--muted); font-weight:600;">Email</span>
                  <span id="profile-email" style="color:var(--text); font-weight:500;">--</span>
                </div>
                <div class="profile-info-row" style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
                  <span class="profile-info-label" style="color:var(--muted); font-weight:600;">Teléfono</span>
                  <span id="profile-phone" style="color:var(--text); font-weight:500;">--</span>
                </div>
              </div>
            </div>

            <div class="profile-footer" id="profile-footer-actions" style="padding:20px 30px; background:var(--bg); border-top:1px solid rgba(255, 255, 255, 0.05); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
              <span id="motivational-msg" style="color:var(--muted);">
                ¡Buen trabajo! Has completado el
                <span class="profile-highlight" id="footer-percentage" style="color:var(--primary); font-weight:bold;">0%</span> de tus tareas asignadas.
              </span>
              <div id="self-actions-container">
                <button class="btn-primary" id="btnEditProfile">Configuración de cuenta</button>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <!-- Modal para Editar Perfil -->
  <div id="editProfileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Mi Información</h2>
            <span class="close-modal" id="closeEditProfileModal">&times;</span>
        </div>
        <form id="editProfileForm">
            <div class="input-group">
                <label for="edit_nombre">Nombre</label>
                <input type="text" id="edit_nombre" name="nombre" required>
            </div>
            <div class="input-group">
                <label for="edit_apellido">Apellido</label>
                <input type="text" id="edit_apellido" name="apellido" required>
            </div>
            <div class="input-group">
                <label for="edit_telefono">Teléfono</label>
                <input type="text" id="edit_telefono" name="telefono">
            </div>
            <div class="input-group">
                <label for="edit_password">Nueva Contraseña (dejar en blanco para no cambiar)</label>
                <input type="password" id="edit_password" name="password" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="edit_password_confirm">Confirmar Nueva Contraseña</label>
                <input type="password" id="edit_password_confirm" autocomplete="new-password">
            </div>
            <p class="notification-text" style="margin-bottom: 15px;">
                Nota: Tu correo y rol solo pueden ser cambiados por un administrador.
            </p>
            <button type="submit" class="btn-primary" >Guardar Cambios</button>
        </form>
    </div>
  </div>

    <div id="app-footer"></div>
  <script type="module" src="../js/main.js?v=1.1.0"></script>
</body>
</html>
