<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Mi Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles.css?v=1.1.0" />
  
</head>
<body>
  <div class="app">
    <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <header class="content-header">
          <div class="content-title">
            <h1>Mi perfil</h1>
            <p>Consulta tu información y tu rendimiento.</p>
          </div>
        </header>

        <section>
          <div class="card">
            <div class="profile-header">
              <div class="profile-avatar" id="profile-avatar-large">U</div>
              <div>
                <div class="profile-name" id="profile-name">Cargando...</div>
                <div class="profile-role" id="profile-role">Cargando...</div>
                <div class="profile-badges">
                  <span class="badge">Activo</span>
                  <span class="badge badge-secondary" id="profile-dept">Constructora GG</span>
                </div>
              </div>
            </div>

            <div class="profile-grid">
              <!-- Info personal -->
              <div class="profile-info-list">
                <div class="profile-info-row">
                  <span class="profile-info-label">Email</span>
                  <span id="profile-email">--</span>
                </div>
                <div class="profile-info-row">
                  <span class="profile-info-label">Teléfono</span>
                  <span id="profile-phone">--</span>
                </div>
              </div>

            </div>

            <div class="profile-footer" id="profile-footer-actions">
              <span id="motivational-msg">
                ¡Buen trabajo! Has completado el
                <span class="profile-highlight" id="footer-percentage">0%</span> de tus tareas asignadas.
              </span>
              <div id="self-actions-container">
                <button class="btn-ghost" id="btnEditProfile">Configuración de cuenta</button>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <!-- Modal para Editar Perfil -->
  <div id="editProfileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Mi Información</h2>
            <span class="close-modal" id="closeEditProfileModal">&times;</span>
        </div>
        <form id="editProfileForm">
            <div class="input-group">
                <label for="edit_nombre">Nombre</label>
                <input type="text" id="edit_nombre" name="nombre" required>
            </div>
            <div class="input-group">
                <label for="edit_apellido">Apellido</label>
                <input type="text" id="edit_apellido" name="apellido" required>
            </div>
            <div class="input-group">
                <label for="edit_telefono">Teléfono</label>
                <input type="text" id="edit_telefono" name="telefono">
            </div>
            <div class="input-group">
                <label for="edit_password">Nueva Contraseña (dejar en blanco para no cambiar)</label>
                <input type="password" id="edit_password" name="password" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="edit_password_confirm">Confirmar Nueva Contraseña</label>
                <input type="password" id="edit_password_confirm" autocomplete="new-password">
            </div>
            <p class="notification-text" style="margin-bottom: 15px;">
                Nota: Tu correo y rol solo pueden ser cambiados por un administrador.
            </p>
            <button type="submit" class="btn-primary" >Guardar Cambios</button>
        </form>
    </div>
  </div>

    <div id="app-footer"></div>
  <script type="module" src="../js/main.js?v=1.1.0"></script>
</body>
</html>
