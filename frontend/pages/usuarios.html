<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Gestión de Usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles.css?v=1.0.3" />
  
</head>
<body class="role-admin">
  <div class="app">
   <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <header class="content-header">
          <div class="content-title">
            <h1>Gestión de Usuarios</h1>
            <p>Listado completo y control de accesos.</p>
          </div>
          <div class="chips-row" id="roleFilters">
            <div class="chip chip-active" data-role="all">Todos los roles</div>
            <div class="chip" data-role="1">Administradores</div>
            <div class="chip" data-role="2">Líderes</div>
            <div class="chip" data-role="3">Operarios</div>
          </div>
          <div class="chips-row" id="availabilityFilters" style="margin-top: 10px;">
            <div class="chip chip-active" data-availability="all">Todos los estados</div>
            <div class="chip" data-availability="free">Libres / Disponibles</div>
            <div class="chip" data-availability="occupied">En Proyecto</div>
          </div>
        </header>

        <section>
            <div class="action-bar" >
                <input type="text" id="userInputSearch" class="input-search" placeholder="Buscar usuario (Nombre, Correo, Rol...)" >
                <button class="btn-primary" id="btnAddUser">
                    <span class="icon">+</span>
                    <span>Agregar usuario</span>
                </button>
            </div>
            
            <div class="user-list" id="userList">
                <!-- Los usuarios se cargarán dinámicamente aquí -->
            </div>

            <div >
                <button class="btn-ghost">Cargar más usuarios</button>
            </div>
        </section>
      </section>
    </main>
  </div>
    <div id="app-footer"></div>

        <!-- Modal para Agregar Usuario -->
        <div id="userModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
              <h2>Agregar Nuevo Usuario</h2>
              <span class="close-modal" id="closeUserModal">&times;</span>
          </div>
          <form id="userForm">
              <div class="input-group">
                  <label for="nombre">Nombre</label>
                  <input type="text" id="nombre" name="nombre" required>
              </div>
              <div class="input-group">
                  <label for="apellido">Apellido</label>
                  <input type="text" id="apellido" name="apellido" required>
              </div>
              <div class="input-group">
                  <label for="correo">Correo Electrónico (Usuario)</label>
                  <div class="input-email-wrapper">
                      <input type="text" id="correo" name="correo_prefix" placeholder="ejemplo.nombre" required>
                      <span class="email-suffix">@constructora-gg.com</span>
                  </div>
              </div>
              <div class="input-group">
                  <label for="telefono">Teléfono</label>
                  <input type="text" id="telefono" name="telefono">
              </div>
              <div class="input-group">
                  <label for="id_rol_fk">Rol</label>
                  <select id="id_rol_fk" name="id_rol_fk" required>
                      <option value="1">Administrador</option>
                      <option value="2">Líder</option>
                      <option value="3">Operario</option>
                  </select>
              </div>
              <div class="input-group">
                  <label for="password">Contraseña</label>
                  <input type="password" id="password" name="password" required>
              </div>
              <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; height: 45px;">Guardar Usuario</button>
          </form>
        </div>
        </div>

        <!-- Modal para Editar Usuario y Restablecer Contraseña -->
        <div id="editUserModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
              <h2>Editar Usuario / Reset Pass</h2>
              <span class="close-modal" id="closeEditUserModal">&times;</span>
          </div>
          <form id="editUserForm">
              <input type="hidden" id="edit_user_id">
              <div class="input-group">
                  <label for="edit_u_nombre">Nombre</label>
                  <input type="text" id="edit_u_nombre" name="nombre" required>
              </div>
              <div class="input-group">
                  <label for="edit_u_apellido">Apellido</label>
                  <input type="text" id="edit_u_apellido" name="apellido" required>
              </div>
              <div class="input-group">
                  <label for="edit_u_telefono">Teléfono</label>
                  <input type="text" id="edit_u_telefono" name="telefono">
              </div>
              <div class="input-group">
                  <label for="edit_u_rol">Rol</label>
                  <select id="edit_u_rol" name="id_rol_fk" required>
                      <option value="1">Administrador</option>
                      <option value="2">Líder</option>
                      <option value="3">Operario</option>
                  </select>
              </div>
              <div class="input-group" style="background: #fffbeb; padding: 10px; border-radius: 8px; border: 1px solid #fef3c7;">
                  <label for="edit_u_password" style="color: #92400e;">Nueva Contraseña (Reset)</label>
                  <input type="password" id="edit_u_password" name="password" placeholder="Solo si desea cambiarla">
                  <p style="font-size: 0.7rem; color: #b45309; margin-top: 4px;">Escribe una nueva contraseña para el usuario aquí.</p>
              </div>
              <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px; height: 45px;">Guardar Cambios</button>
          </form>
        </div>
        </div>

        <script type="module" src="../js/main.js"></script>
        </body>
        </html>
