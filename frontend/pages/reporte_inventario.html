<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Reporte de Inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout/base.css" />
    <link rel="stylesheet" href="../css/layout/sidebar.css" />
    <link rel="stylesheet" href="../css/layout/content.css" />
  <link rel="stylesheet" href="../css/components/chips.css" />
    <link rel="stylesheet" href="../css/components/cards.css" />
    <link rel="stylesheet" href="../css/components/modals.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/toasts.css" />
    <link rel="stylesheet" href="../css/components/utilities.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/pages/reporte_inventario.css" />
  
</head>
<body class="role-admin">
  <div class="app">
    <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <div class="report-container">
            <div class="report-header-flex">
                <div>
                    <h1>Reporte Detallado de Existencias</h1>
                    <p id="reportDate">Fecha de generación: --</p>
                </div>
                <div class="brand-logo" style="width: 60px; height: 60px; font-size: 1.5rem;">GG</div>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <span class="value" id="totalItems">--</span>
                    <span class="label">Materiales Totales</span>
                </div>
                <div class="summary-card">
                    <span class="value" id="lowStockCount" style="color: #ef4444;">--</span>
                    <span class="label">Alertas de Stock Bajo</span>
                </div>
                <div class="summary-card">
                    <span class="value" id="totalUnits">--</span>
                    <span class="label">Unidades en Almacén</span>
                </div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Categoría</th>
                        <th>Stock Actual</th>
                        <th>Stock Mínimo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;">Cargando datos del reporte...</td>
                    </tr>
                </tbody>
            </table>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="../js/main.js?v=1.1.0"></script>
</body>
</html>
