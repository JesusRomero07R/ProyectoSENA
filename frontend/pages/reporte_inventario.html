<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Reporte de Inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles.css?v=1.0.3" />
  <style>
    .report-container {
        background: var(--bg-card);
        padding: 30px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
    }
    .report-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        border-bottom: 2px solid var(--bg);
        padding-bottom: 15px;
    }
    .report-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    .report-table th, .report-table td {
        text-align: left;
        padding: 12px 15px;
        border-bottom: 1px solid var(--border);
    }
    .report-table th {
        background: var(--bg);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        color: var(--muted);
    }
    .status-badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .status-ok { background: #d1fae5; color: #059669; }
    .status-low { background: #fee2e2; color: #ef4444; }
    
    .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .summary-card {
        background: var(--bg);
        padding: 20px;
        border-radius: var(--radius-md);
        text-align: center;
    }
    .summary-card .value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--primary);
        display: block;
    }
    .summary-card .label {
        font-size: 0.9rem;
        color: var(--muted);
    }

    @media print {
        .sidebar, .app-header, .logout-btn, .btn-outline, .mobile-bottom-nav { display: none !important; }
        .layout { display: block !important; }
        .report-container { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body class="role-admin">
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">GG</div>
        <div class="brand-text">
          <span>Constructora GG</span>
          <span>Reporte de Stock</span>
        </div>
      </div>
      <div class="app-header-right">
        <button onclick="window.print()" class="btn-outline">
            <span class="icon">⎙</span>
            <span>Imprimir Reporte</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div>
          <div class="sidebar-section-title">Menú</div>
          <nav class="nav">
            <a class="nav-link" href="../dashboard.html">
              <span class="icon">Π</span>
              <span class="label">Inicio</span>
            </a>
            <a class="nav-link" href="inventario.html">
              <span class="icon">📦</span>
              <span class="label">Inventario</span>
            </a>
          </nav>
        </div>
        <div >
            <button class="btn-outline" onclick="history.back()" >
                <span class="icon">←</span>
                <span>Volver</span>
            </button>
        </div>
      </aside>

      <section class="content">
        <div class="report-container">
            <div class="report-header-flex">
                <div>
                    <h1>Reporte Detallado de Existencias</h1>
                    <p id="reportDate">Fecha de generación: --</p>
                </div>
                <div class="brand-logo" style="width: 60px; height: 60px; font-size: 1.5rem;">GG</div>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <span class="value" id="totalItems">--</span>
                    <span class="label">Materiales Totales</span>
                </div>
                <div class="summary-card">
                    <span class="value" id="lowStockCount" style="color: #ef4444;">--</span>
                    <span class="label">Alertas de Stock Bajo</span>
                </div>
                <div class="summary-card">
                    <span class="value" id="totalUnits">--</span>
                    <span class="label">Unidades en Almacén</span>
                </div>
            </div>

            <table class="report-table">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Categoría</th>
                        <th>Stock Actual</th>
                        <th>Stock Mínimo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;">Cargando datos del reporte...</td>
                    </tr>
                </tbody>
            </table>
        </div>
      </section>
    </main>
  </div>
  <script src="../app.js?v=1.3.0"></script>
</body>
</html>
