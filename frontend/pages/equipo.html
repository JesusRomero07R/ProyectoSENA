<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Constructora GG – Mi Equipo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css?v=1.0.3" />
    
</head>
<body class="role-lider">
    <div class="app">
        <div id="app-header"></div>

        <main class="layout">
      <div id="app-sidebar"></div>

            <section class="content">
                <header class="content-header">
                    <div class="content-title">
                        <h1>Mi Equipo</h1>
                        <p id="teamSummary">Cargando personal...</p>
                    </div>
                    <div class="chips-row" id="teamFilters">
                        <div class="chip chip-active" data-status="all">Todos</div>
                        <div class="chip" data-status="disponible">Disponibles</div>
                        <div class="chip" data-status="ocupado">Ocupados</div>
                    </div>
                </header>

                <section>
                    <div class="action-bar" >
                        <input type="text" id="teamInputSearch" class="input-search" placeholder="Buscar miembro por nombre o correo..." style="flex-grow: 1;">
                        <button class="btn-primary role-admin-only" id="btnManageTeam" style="white-space: nowrap; display: none;">
                            <span class="icon">+</span>
                            <span>Asignar Operarios</span>
                        </button>
                    </div>
                    
                    <div class="user-list" id="teamListContainer">
                        <!-- Se cargará dinámicamente -->
                    </div>

                    <div >
                        <button class="btn-ghost">Cargar más miembros</button>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <div id="app-footer"></div>
    <!-- Modal para Gestionar Equipo -->
    <div id="teamModal" class="modal">
      <div class="modal-content">
          <div class="modal-header">
              <h2>Asignar Operarios al Proyecto</h2>
              <span class="close-modal" id="closeTeamModal">&times;</span>
          </div>
          <p class="notification-text" style="margin-bottom: 15px;">
              Selecciona los operarios disponibles. Recuerda que un operario solo puede estar en un proyecto activo a la vez.
          </p>
          <form id="teamForm">
              <div id="availableOperatorsList" style="max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; margin-bottom: 15px;">
                  <p class="text-subtle-italic" style="border-top: none;">Buscando operarios disponibles...</p>
              </div>
              <button type="submit" class="btn-primary" style="width: 100%; height: 45px;">Confirmar Asignación</button>
          </form>
      </div>
    </div>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
