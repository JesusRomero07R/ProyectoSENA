<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constructora GG – Inventario de Obra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout/base.css" />
    <link rel="stylesheet" href="../css/layout/sidebar.css" />
    <link rel="stylesheet" href="../css/layout/content.css" />
  <link rel="stylesheet" href="../css/components/chips.css" />
    <link rel="stylesheet" href="../css/components/cards.css" />
    <link rel="stylesheet" href="../css/components/modals.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/toasts.css" />
    <link rel="stylesheet" href="../css/components/utilities.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/pages/materiales.css" />
  
</head>
<body class="role-lider">
  <div class="app">
    <div id="app-header"></div>

    <main class="layout">
      <div id="app-sidebar"></div>

      <section class="content">
        <header class="content-header">
          <div class="content-title">
            <h1>Inventario en Obra</h1>
            <p>Existencias disponibles en los proyectos asignados.</p>
          </div>
        </header>

        <section>
            <div class="action-bar" >
                <input type="text" id="matInputSearch" class="input-search" placeholder="Buscar material..." >
                <button class="btn-primary role-lider" id="btnRequestGlobal">
                    <span class="icon">📥</span>
                    <span>Pedir a Almacén Central</span>
                </button>
            </div>
            
            <div id="projectMaterialsContainer">
                <p style="text-align: center; padding: 40px; color: var(--muted);">Cargando materiales del proyecto...</p>
            </div>
        </section>
      </section>
    </main>
  </div>

  <!-- Modal para Traslado de Material (Líder) -->
  <div id="transferModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Solicitar a Almacén Central</h2>
            <span class="close-modal" id="closeTransferModal">&times;</span>
        </div>
        <form id="transferForm">
            <div class="input-group" id="trans_project_group">
                <label for="trans_project">Proyecto Destino</label>
                <select id="trans_project" name="id_proyecto" required>
                    <option value="">Selecciona un proyecto</option>
                </select>
            </div>
            <div class="input-group">
                <label for="trans_material">Material a Solicitar</label>
                <select id="trans_material" name="id_material" required>
                    <option value="">Selecciona un material</option>
                </select>
            </div>
            <div class="input-group">
                <label for="trans_qty">Cantidad</label>
                <input type="number" id="trans_qty" name="cantidad" min="1" required>
            </div>
            <p id="globalStockHint" class="notification-text" style="margin-bottom: 15px;">
                Stock disponible en almacén central: <span id="valGlobalStock">--</span>
            </p>
            <button type="submit" class="btn-primary" >Confirmar Solicitud</button>
        </form>
    </div>
  </div>

  <script type="module" src="../js/main.js?v=1.1.0"></script>
</body>
</html>
