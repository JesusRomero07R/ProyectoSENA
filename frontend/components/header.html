<header class="app-header">
        <a class="brand" href="/" style="text-decoration:none;cursor:pointer;">
            <div class="brand-logo">GG</div>
            <div class="brand-text">
                <span>Constructora GG</span>
                <span id="role-display-name">Cargando panel...</span> 
            </div>
        </a>
        <div class="app-header-right">
            <button id="btnToggleTheme" class="theme-toggle-btn" type="button" title="Cambiar tema" style="padding: 8px 12px;">
